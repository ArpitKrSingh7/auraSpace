version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - VISION_SERVICE_URL=http://vision:8000
      - NEXT_PUBLIC_VISION_API_URL=http://vision:8000
    depends_on:
      - vision
    restart: unless-stopped

  vision:
    build:
      context: ./services/vision
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=info
      - DEVICE=cpu
    restart: unless-stopped
