[project]
name = "auraspace-vision"
version = "1.0.0"
description = "AuraSpace image processing, furniture detection, and room geometry service"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "pydantic>=2.6.0",
  "numpy>=1.26.0",
  "opencv-python-headless>=4.9.0",
  "pillow>=10.2.0",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "python-multipart>=0.0.9",
  "requests>=2.31.0",
  "transformers==4.57.1",
  "safetensors==0.6.2",
]

[tool.vercel]
entrypoint = "main:app"

[tool.vercel.scripts]
build = "python scripts/download_models.py --include-depth --output models"

# Only Torch packages use this index. requests and the other dependencies stay
# on PyPI instead of being shadowed by stale packages on the PyTorch mirror.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
