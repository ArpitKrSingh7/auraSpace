services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auraspace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-auraspace-database-only}
      POSTGRES_DB: auraspace
    ports: ["127.0.0.1:5438:5432"]
    volumes: ["auraspace-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auraspace"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-local-auraspace-queue-only}"]
    ports: ["127.0.0.1:6388:6379"]
    volumes: ["auraspace-queue:/data"]
  media:
    image: chrislusf/seaweedfs:4.50
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-volume.max=20", "-master.volumeSizeLimitMB=256"]
    ports: ["127.0.0.1:9008:8333"]
    volumes:
      - auraspace-media:/data
      - ./infra/s3.local.json:/etc/seaweedfs/s3.json:ro

volumes:
  auraspace-db:
  auraspace-queue:
  auraspace-media:
